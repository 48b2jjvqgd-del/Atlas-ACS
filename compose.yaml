# ATLAS ACS — local development environment.
#
#   pnpm setup:env                      # create .env with generated local passwords (once)
#   docker compose up -d --wait         # core infrastructure only
#   docker compose --profile services up -d --build --wait     # + migrations, all services, portal
#   docker compose --profile identity up -d --wait             # + Keycloak
#   docker compose down                 # stop (volumes kept); add -v to delete local data
#
# Host ports bind to 127.0.0.1 only. Nothing here is suitable for any shared or production use.

name: atlas-acs

x-service: &service
  profiles: [services]
  build:
    context: .
    dockerfile: infrastructure/docker/service.Dockerfile
    target: service
  restart: unless-stopped
  stop_grace_period: 15s
  depends_on: &service-depends
    migrate:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy
    valkey:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

x-service-env: &service-env
  ATLAS_ENV: ${ATLAS_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_PRETTY: 'false'
  HOST: 0.0.0.0
  DATABASE_URL: postgres://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD:?run pnpm setup:env}@postgres:5432/${POSTGRES_DB:-atlas}
  VALKEY_URL: redis://:${VALKEY_PASSWORD:?run pnpm setup:env}@valkey:6379/0
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-atlas}:${RABBITMQ_PASSWORD:?run pnpm setup:env}@rabbitmq:5672

services:
  # ---------------------------------------------------------------- infrastructure
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run pnpm setup:env}
      POSTGRES_DB: ${POSTGRES_DB:-atlas}
    ports: ['127.0.0.1:5432:5432']
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20

  # Valkey (BSD-3-Clause) replaces Redis (ADR-019). Same protocol; clients use redis:// URLs.
  valkey:
    image: valkey/valkey:9.1.3-alpine
    restart: unless-stopped
    command:
      [
        'valkey-server',
        '--requirepass',
        '${VALKEY_PASSWORD:?run pnpm setup:env}',
        '--appendonly',
        'yes',
      ]
    environment:
      VALKEYCLI_AUTH: ${VALKEY_PASSWORD:?run pnpm setup:env}
    ports: ['127.0.0.1:6379:6379']
    volumes: [valkey-data:/data]
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.4.0-management-alpine
    restart: unless-stopped
    hostname: atlas-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-atlas}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?run pnpm setup:env}
    ports:
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:15672:15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./infrastructure/docker/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_port_connectivity']
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  mailpit:
    image: axllent/mailpit:v1.33.0
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 1000
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    extra_hosts: ['host.docker.internal:host-gateway']
    ports: ['127.0.0.1:9090:9090']
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9090/-/ready']
      interval: 10s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana-oss:13.0.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run pnpm setup:env}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
    depends_on:
      prometheus:
        condition: service_healthy
    ports: ['127.0.0.1:3000:3000']
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/api/health']
      interval: 10s
      timeout: 3s
      retries: 10

  keycloak:
    profiles: [identity]
    image: quay.io/keycloak/keycloak:26.8.0
    command: ['start-dev', '--import-realm']
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?run pnpm setup:env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-atlas}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?run pnpm setup:env}
      KC_HEALTH_ENABLED: 'true'
      KC_HTTP_PORT: '8080'
    depends_on:
      postgres:
        condition: service_healthy
    ports: ['127.0.0.1:8180:8080']
    volumes:
      - ./infrastructure/docker/keycloak/atlas-realm.json:/opt/keycloak/data/import/atlas-realm.json:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ---------------------------------------------------------------- ATLAS
  migrate:
    profiles: [services]
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
      target: migrator
    image: atlas-acs/migrator:local
    command: ['up']
    environment:
      ATLAS_ENV: ${ATLAS_ENV:-development}
      MIGRATION_DATABASE_URL: postgres://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD:?run pnpm setup:env}@postgres:5432/${POSTGRES_DB:-atlas}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api-gateway:
    <<: *service
    build:
      {
        context: .,
        dockerfile: infrastructure/docker/service.Dockerfile,
        target: service,
        args: { SERVICE: api-gateway },
      }
    image: atlas-acs/api-gateway:local
    environment:
      <<: *service-env
      PORT: 4000
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8080
      ATLAS_SERVICE_URLS: api-gateway=http://127.0.0.1:4000,acs-core=http://acs-core:4001,protocol=http://protocol:4002,visa-adapter=http://visa-adapter:4003,mastercard-adapter=http://mastercard-adapter:4004,fraud-engine=http://fraud-engine:4005,compliance-engine=http://compliance-engine:4006,challenge-engine=http://challenge-engine:4007,issuer-service=http://issuer-service:4008,cardholder-service=http://cardholder-service:4009,identity-service=http://identity-service:4010,reporting-service=http://reporting-service:4011,audit-service=http://audit-service:4012
    ports: ['127.0.0.1:4000:4000']

  acs-core:
    <<: *service
    build:
      {
        context: .,
        dockerfile: infrastructure/docker/service.Dockerfile,
        target: service,
        args: { SERVICE: acs-core },
      }
    image: atlas-acs/acs-core:local
    environment: { <<: *service-env, PORT: 4001 }
    ports: ['127.0.0.1:4001:4001']

  protocol:
    <<: *service
    build:
      {
        context: .,
        dockerfile: infrastructure/docker/service.Dockerfile,
        target: service,
        args: { SERVICE: protocol },
      }
    image: atlas-acs/protocol:local
    environment: { <<: *service-env, PORT: 4002 }
    ports: ['127.0.0.1:4002:4002']

  visa-adapter:
    <<: *service
    build:
      {
        context: .,
        dockerfile: infrastructure/docker/service.Dockerfile,
        target: service,
        args: { SERVICE: visa-adapter },
      }
    image: atlas-acs/visa-adapter:local
    environment: { <<: *service-env, PORT: 4003 }
    ports: ['127.0.0.1:4003:4003']

  mastercard-adapter:
    <<: *service
    build:
      {
        context: .,
        dockerfile: infrastructure/docker/service.Dockerfile,
        target: service,
        args: { SERVICE: mastercard-adapter },
      }
    image: atlas-acs/mastercard-adapter:local
    environment: { <<: *service-env, PORT: 4004 }
    ports: ['127.0.0.1:4004:4004']

  fraud-engine:
    <<: *service
    build:
      {
        context: .,
        dockerfile: infrastructure/docker/service.Dockerfile,
        target: service,
        args: { SERVICE: fraud-engine },
      }
    image: atlas-acs/fraud-engine:local
    environment: { <<: *service-env, PORT: 4005 }
    ports: ['127.0.0.1:4005:4005']

  compliance-engine:
    <<: *service
    build:
      {
        context: .,
        dockerfile: infrastructure/docker/service.Dockerfile,
        target: service,
        args: { SERVICE: compliance-engine },
      }
    image: atlas-acs/compliance-engine:local
    environment: { <<: *service-env, PORT: 4006 }
    ports: ['127.0.0.1:4006:4006']

  challenge-engine:
    <<: *service
    build:
      {
        context: .,
        dockerfile: infrastructure/docker/service.Dockerfile,
        target: service,
        args: { SERVICE: challenge-engine },
      }
    image: atlas-acs/challenge-engine:local
    environment: { <<: *service-env, PORT: 4007 }
    ports: ['127.0.0.1:4007:4007']

  issuer-service:
    <<: *service
    build:
      {
        context: .,
        dockerfile: infrastructure/docker/service.Dockerfile,
        target: service,
        args: { SERVICE: issuer-service },
      }
    image: atlas-acs/issuer-service:local
    environment: { <<: *service-env, PORT: 4008 }
    ports: ['127.0.0.1:4008:4008']

  cardholder-service:
    <<: *service
    build:
      {
        context: .,
        dockerfile: infrastructure/docker/service.Dockerfile,
        target: service,
        args: { SERVICE: cardholder-service },
      }
    image: atlas-acs/cardholder-service:local
    environment: { <<: *service-env, PORT: 4009 }
    ports: ['127.0.0.1:4009:4009']

  identity-service:
    <<: *service
    build:
      {
        context: .,
        dockerfile: infrastructure/docker/service.Dockerfile,
        target: service,
        args: { SERVICE: identity-service },
      }
    image: atlas-acs/identity-service:local
    environment: { <<: *service-env, PORT: 4010 }
    ports: ['127.0.0.1:4010:4010']

  reporting-service:
    <<: *service
    build:
      {
        context: .,
        dockerfile: infrastructure/docker/service.Dockerfile,
        target: service,
        args: { SERVICE: reporting-service },
      }
    image: atlas-acs/reporting-service:local
    environment: { <<: *service-env, PORT: 4011 }
    ports: ['127.0.0.1:4011:4011']

  audit-service:
    <<: *service
    build:
      {
        context: .,
        dockerfile: infrastructure/docker/service.Dockerfile,
        target: service,
        args: { SERVICE: audit-service },
      }
    image: atlas-acs/audit-service:local
    environment: { <<: *service-env, PORT: 4012 }
    ports: ['127.0.0.1:4012:4012']

  portal:
    profiles: [services]
    build:
      context: .
      dockerfile: infrastructure/docker/portal.Dockerfile
    image: atlas-acs/portal:local
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
    ports: ['127.0.0.1:8080:8080']

volumes:
  postgres-data:
  valkey-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
