name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

# Actions are pinned to full commit SHAs (tag in the trailing comment); Dependabot keeps them current.
jobs:
  quality:
    name: Quality (format, lint, types, unit, build, smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Smoke test built services (start, health, graceful shutdown)
        run: pnpm test:smoke
      - name: Export contract JSON Schemas
        run: pnpm --filter @atlas/contracts export:json-schema
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract-json-schemas
          path: packages/contracts/dist/json-schema/
          retention-days: 14

  integration:
    name: Integration (PostgreSQL, Valkey, RabbitMQ)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate ephemeral local credentials
        run: pnpm setup:env
      - name: Start infrastructure (same definitions as local development)
        run: docker compose up -d --wait postgres valkey rabbitmq
      - name: Apply migrations
        run: pnpm db:migrate && pnpm db:status
      - name: Roll back and re-apply (rollback strategy check)
        run: pnpm db:rollback --owner issuer && pnpm db:migrate
      - run: pnpm test:integration
      - name: Infrastructure logs on failure
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v

  e2e:
    name: Portal E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @atlas/e2e-tests install-browsers
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 7

  containers:
    name: Container builds and Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Validate Compose configuration (all profiles)
        run: |
          cp .env.example .env
          docker compose --profile services --profile identity config --quiet
      - name: Build service image (api-gateway)
        run: docker build -f infrastructure/docker/service.Dockerfile --build-arg SERVICE=api-gateway --build-arg BUILD_SHA=${{ github.sha }} -t atlas-acs/api-gateway:ci .
      - name: Build migrator image
        run: docker build -f infrastructure/docker/service.Dockerfile --target migrator -t atlas-acs/migrator:ci .
      - name: Build portal image
        run: docker build -f infrastructure/docker/portal.Dockerfile -t atlas-acs/portal:ci .
      - name: Container starts as non-root and serves health
        run: |
          docker run -d --name gw -p 127.0.0.1:4000:4000 -e PORT=4000 -e ATLAS_ENV=test atlas-acs/api-gateway:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4000/health/live && break; sleep 1; done
          test "$(docker exec gw id -u)" != "0"
          docker stop -t 15 gw
          test "$(docker inspect gw --format '{{.State.ExitCode}}')" = "0"

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Fail on high or critical advisories
        run: pnpm audit --audit-level high
