# Prometheus configuration for local development.
#
# Two jobs scrape the same services in the two ways they can run locally:
#   atlas-services       containers started with `docker compose --profile services`
#   atlas-services-host  processes started on the host with `pnpm dev:services`
# Targets of whichever mode is not in use simply show as down.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [127.0.0.1:9090]

  - job_name: atlas-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - api-gateway:4000
          - acs-core:4001
          - protocol:4002
          - visa-adapter:4003
          - mastercard-adapter:4004
          - fraud-engine:4005
          - compliance-engine:4006
          - challenge-engine:4007
          - issuer-service:4008
          - cardholder-service:4009
          - identity-service:4010
          - reporting-service:4011
          - audit-service:4012
        labels:
          mode: compose

  - job_name: atlas-services-host
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:4000
          - host.docker.internal:4001
          - host.docker.internal:4002
          - host.docker.internal:4003
          - host.docker.internal:4004
          - host.docker.internal:4005
          - host.docker.internal:4006
          - host.docker.internal:4007
          - host.docker.internal:4008
          - host.docker.internal:4009
          - host.docker.internal:4010
          - host.docker.internal:4011
          - host.docker.internal:4012
        labels:
          mode: host

  - job_name: rabbitmq
    static_configs:
      - targets: [rabbitmq:15692]
